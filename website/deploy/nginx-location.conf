# Static site vhost body. Written by deploy/install.sh; do not paste by hand.
#
# There is no PHP: every page is a file under public/. Clean URLs are served by
# try_files "$uri.html", so /download resolves to download.html without a
# rewrite loop, and a request for a missing page lands on the 404 document
# instead of a blank origin error.
root @@DOCUMENT_ROOT@@;
index index.html;

# Long-lived caching is safe here precisely because there is no backend: the
# pages are files, and a deploy replaces them. HTML stays short-lived so a
# release shows up immediately, while assets are immutable per deploy.
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
}

location ^~ /css/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}

location ^~ /js/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
}

# The release feed is refreshed at package time; keep it short-lived so a new
# deploy is visible without a cache purge.
location ^~ /data/ {
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
}

location ^~ /.well-known/acme-challenge/ {
    try_files $uri =404;
}

location / {
    try_files $uri $uri.html $uri/ =404;
}

error_page 404 /404.html;

location ~ /\. {
    deny all;
}

# Nothing executable is served: refuse the extensions that would imply a
# runtime, even though the package ships none of them.
location ~* \.(?:php|phtml|phar|cgi|pl|py|sh|bak|conf|dist|fla|ini|log|sql|sqlite|tmp|yaml|yml)$ {
    deny all;
}

expires off;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
